<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Video Blocked</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #1a1a1a;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #2a2a2a;
            border-radius: 16px;
            max-width: 500px;
            border: 2px solid #ff4444;
        }
        h1 {
            color: #ff4444;
            margin-bottom: 20px;
        }
        .title {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 14px;
            color: #aaa;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Video Blocked</h1>
        <p>This video was identified as distracting by AI</p>
        <div class="title" id="videoTitle">Loading...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoTitle = decodeURIComponent(urlParams.get('title') || 'Unknown Video');
        document.getElementById('videoTitle').textContent = videoTitle;
        
        // go back after 5 seconds
        // setTimeout(() => window.history.back(), 5000);
    </script>
</body>
</html>
